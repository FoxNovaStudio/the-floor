<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Floor</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0a;--white:#f5f0e8;--gold:#c8a84b;--red:#d63b2f;--green:#2d8a4e;--gray:#1e1e1e;--gray2:#2a2a2a;--gray3:#3d3d3d;--muted:#777}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;width:100%;background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;height:100%;align-items:center;justify-content:center;padding:2rem}
.screen.active{display:flex}

/* HOME */
#home{position:relative;overflow:hidden}
#home::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 28%,#c8a84b1a,transparent 65%);pointer-events:none}
.logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(76px,23vw,112px);color:var(--gold);line-height:.88;text-align:center;letter-spacing:.04em}
.logo-sub{font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--muted);margin-top:.4rem;margin-bottom:2.5rem;text-align:center}
.hbtn{width:100%;max-width:300px;padding:17px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;border:none;transition:transform .1s;margin-bottom:10px;position:relative;z-index:1}
.hbtn:active{transform:scale(.95)}
.hbtn-gold{background:var(--gold);color:var(--black)}
.hbtn-outline{background:transparent;color:var(--white);border:1.5px solid var(--gray3)}
.join-wrap{width:100%;max-width:300px;overflow:hidden;max-height:0;transition:max-height .35s ease;position:relative;z-index:1}
.join-wrap.open{max-height:200px}
.code-input{width:100%;background:var(--gray2);border:1.5px solid var(--gray3);border-radius:6px;color:var(--white);font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:.22em;text-align:center;padding:13px 8px;text-transform:uppercase;margin-top:8px}
.code-input:focus{outline:none;border-color:var(--gold)}
.go-btn{width:100%;margin-top:8px;background:var(--gold);color:var(--black);border:none;border-radius:6px;padding:15px;font-size:16px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer}
.go-btn:active{transform:scale(.95)}
.err{color:var(--red);font-size:13px;text-align:center;margin-top:6px;min-height:16px}

/* LOBBY */
#lobby{gap:.6rem;text-align:center}
.lbl{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.room-code{font-family:'Bebas Neue',sans-serif;font-size:clamp(88px,26vw,128px);color:var(--gold);letter-spacing:.14em;line-height:1}
.dots span{display:inline-block;animation:dot 1.4s infinite;color:var(--gold);font-size:18px;margin:0 2px}
.dots span:nth-child(2){animation-delay:.22s}.dots span:nth-child(3){animation-delay:.44s}
@keyframes dot{0%,80%,100%{opacity:0}40%{opacity:1}}
.back-btn{margin-top:1rem;background:transparent;color:var(--muted);border:1px solid var(--gray3);border-radius:6px;padding:11px 26px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}

/* SETUP */
#setup{align-items:stretch;justify-content:flex-start;padding:0;overflow:hidden}
.setup-scroll{flex:1;overflow-y:auto;padding:1.25rem 1rem}
.stitle{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold);letter-spacing:.08em;margin-bottom:.2rem}
.ssub{font-size:13px;color:var(--muted);margin-bottom:1rem}
.section-lbl{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin:.9rem 0 .4rem}
.player-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:.5rem}
.player-row{display:flex;align-items:center;gap:8px}
.player-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.player-input{flex:1;background:var(--gray2);border:1px solid var(--gray3);border-radius:6px;color:var(--white);padding:9px 12px;font-size:15px;font-family:'DM Sans',sans-serif}
.player-input:focus{outline:none;border-color:var(--gold)}
.rm-btn{background:transparent;border:1px solid var(--gray3);border-radius:6px;color:var(--muted);padding:7px 11px;font-size:14px;cursor:pointer;flex-shrink:0}
.add-player-btn{background:transparent;border:1px dashed var(--gray3);border-radius:6px;color:var(--muted);padding:10px;font-size:14px;cursor:pointer;width:100%;margin-top:4px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.cat-card{background:var(--gray);border:1.5px solid var(--gray2);border-radius:8px;padding:13px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;user-select:none}
.cat-card.sel{border-color:var(--gold);background:#1b1500}
.cicon{font-size:26px}.cname{font-size:13px;font-weight:600}.ccount{font-size:11px;color:var(--muted)}
.start-bar{padding:1rem;border-top:1px solid var(--gray2);flex-shrink:0;width:100%}
.start-bar button{width:100%;background:var(--gold);color:var(--black);border:none;border-radius:6px;padding:17px;font-size:17px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer}
.start-bar button:disabled{opacity:.3;cursor:not-allowed}

/* WAITING */
#waiting{gap:1.5rem;text-align:center}

/* ══ PLAYER SCREEN ══
   Top: two player timers side by side
   Middle: big image
   Active player highlighted
*/
#playerscreen{align-items:stretch;justify-content:flex-start;padding:0}

/* Timer strip at top */
.timer-strip{display:flex;flex-direction:row;flex-shrink:0;height:110px}
.p-timer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;position:relative;transition:background .3s}
.p-timer.active-side{background:var(--gray2)}
.p-timer.inactive-side{opacity:0.45}
.p-timer-name{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-align:center;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-timer-num{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1}
.arc-svg{width:44px;height:44px}
.arc-track{fill:none;stroke:var(--gray3);stroke-width:5}
.arc-fill{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .4s}
.vs-divider{width:1px;background:var(--gray3);flex-shrink:0;align-self:stretch;margin:12px 0}
.active-indicator{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* Image area */
.img-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.75rem;overflow:hidden;min-height:0}
.qimg{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;display:none}
.img-ph{width:100%;aspect-ratio:4/3;max-height:220px;background:var(--gray);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:44px}
.cat-badge{font-size:11px;color:var(--muted);margin-top:.4rem;letter-spacing:.08em;text-transform:uppercase}

/* ══ JUDGE SCREEN ══ */
#judgescreen{align-items:stretch;justify-content:flex-start;padding:0}
.judge-header{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;background:var(--gray2);flex-shrink:0}
.jactive-wrap{display:flex;align-items:center;gap:6px}
.jactive-dot{width:10px;height:10px;border-radius:50%}
.jactive-name{font-size:14px;font-weight:600}
.jactive-sub{font-size:11px;color:var(--muted)}
.jscore-txt{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--gold);letter-spacing:.04em;text-align:right;max-width:160px;line-height:1.3}

.answer-box{margin:.75rem 1rem .35rem;background:var(--gray);border-radius:10px;padding:1.1rem 1rem;text-align:center;flex-shrink:0}
.albl{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}
.aval{font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,11vw,58px);color:var(--gold);letter-spacing:.05em;line-height:1.05}

.judge-img{flex:1;min-height:0;overflow:hidden;padding:0 1.25rem;display:flex;align-items:center;justify-content:center}
.judge-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;opacity:.35;display:none}

/* Judge dual timers - small */
.judge-timers{display:flex;align-items:center;justify-content:center;gap:20px;padding:.4rem 1rem;flex-shrink:0}
.jt-block{display:flex;flex-direction:column;align-items:center;gap:2px}
.jt-name{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.jt-num{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1}
.jt-arc{width:36px;height:36px}
.jt-track{fill:none;stroke:var(--gray3);stroke-width:4}
.jt-fill{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .4s}

.judge-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:.75rem 1rem 1rem;flex-shrink:0}
.jbtn{padding:18px 8px;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s}
.jbtn:active{transform:scale(.94)}.jbtn:disabled{opacity:.35;cursor:not-allowed}
.jbtn .bi{font-size:22px}
.jok{background:var(--green);color:#fff}.jno{background:var(--red);color:#fff}

/* SCOREBOARD */
#scoreboard{align-items:stretch;justify-content:flex-start;padding:1.5rem;overflow-y:auto;gap:.6rem}
.sb-title{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--gold);letter-spacing:.08em}
.sb-row{background:var(--gray);border-radius:8px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.sb-row .sn{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px}
.sb-row .sp{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--gold)}
.sb-row.winner{border:2px solid var(--gold)}
.sb-sub{font-size:13px;color:var(--muted);text-align:center}
.next-btn{background:var(--gold);color:var(--black);border:none;border-radius:6px;padding:17px;font-size:17px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:auto;width:100%}
.next-btn:active{transform:scale(.97)}

/* FLASH */
.flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:.05em;z-index:200;pointer-events:none;opacity:0;transition:opacity .12s;text-align:center;padding:1rem}
.flash.show{opacity:1}
.flash.ok{background:#2d8a4ecc;color:#fff}
.flash.no{background:#d63b2fcc;color:#fff}
.flash.time{background:#c8a84bcc;color:var(--black)}

/* TOAST */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--gray3);color:var(--white);padding:10px 22px;border-radius:999px;font-size:14px;z-index:300;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}

/* CONNECTING */
#connecting{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:400}
#connecting.show{display:flex}
.conn-box{background:var(--gray);border-radius:10px;padding:2rem;text-align:center;font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div id="home" class="screen active">
    <div class="logo">THE<br>FLOOR</div>
    <div class="logo-sub">Kuvatunnistuspeli</div>
    <button class="hbtn hbtn-gold" onclick="createGame()">Luo peli (Tuomari)</button>
    <button class="hbtn hbtn-outline" onclick="toggleJoin()">Liity peliin (Pelaajat)</button>
    <div class="join-wrap" id="joinWrap">
      <input class="code-input" id="joinCode" maxlength="4" placeholder="KOODI"
        oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')"/>
      <button class="go-btn" onclick="joinGame()">Liity →</button>
      <div class="err" id="joinErr"></div>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="screen">
    <div class="lbl">Pelin koodi – jaa pelaajille</div>
    <div class="room-code" id="lobbyCode">----</div>
    <div class="lbl" id="lobbyStatus" style="margin-top:.5rem">Odotetaan pelaajapuhelinta...</div>
    <div class="dots" id="lobbyDots"><span>●</span><span>●</span><span>●</span></div>
    <button class="hbtn hbtn-gold" id="lobbyNext" onclick="judgeSetup()" style="display:none;margin-top:1.5rem;max-width:240px">Jatka →</button>
    <button class="back-btn" onclick="goHome()">← Peruuta</button>
  </div>

  <!-- SETUP (judge only) -->
  <div id="setup" class="screen">
    <div class="setup-scroll">
      <div class="stitle">Peliasetukset</div>
      <div class="ssub">Tuomari määrittää pelin</div>
      <div class="section-lbl">Pelaajat (pelaajapuhelimella)</div>
      <div class="player-rows" id="playerRows"></div>
      <button class="add-player-btn" onclick="addPlayerRow()">+ Lisää pelaaja</button>
      <div class="section-lbl">Kategoriat (1–4)</div>
      <div class="cat-grid" id="catGrid"></div>
    </div>
    <div class="start-bar">
      <button id="startBtn" onclick="startGame()" disabled>Aloita peli ▶</button>
    </div>
  </div>

  <!-- WAITING (player phone) -->
  <div id="waiting" class="screen">
    <div style="font-size:64px">✅</div>
    <div class="lbl" style="font-size:15px;letter-spacing:.1em;margin-bottom:.5rem">Liitytty peliin!</div>
    <div class="lbl">Tuomari käynnistää pelin...</div>
    <div class="dots"><span>●</span><span>●</span><span>●</span></div>
  </div>

  <!-- PLAYER SCREEN (player phone) -->
  <div id="playerscreen" class="screen">
    <!-- Two timers at top -->
    <div class="timer-strip" id="timerStrip">
      <!-- filled dynamically -->
    </div>
    <!-- Image -->
    <div class="img-area">
      <img class="qimg" id="playerImg" alt="Tunnista!"/>
      <div class="img-ph" id="playerPh">📷</div>
      <div class="cat-badge" id="playerCat"></div>
    </div>
  </div>

  <!-- JUDGE SCREEN -->
  <div id="judgescreen" class="screen">
    <div class="judge-header">
      <div class="jactive-wrap">
        <div class="jactive-dot" id="jActiveDot"></div>
        <div>
          <div class="jactive-name" id="jActiveName">–</div>
          <div class="jactive-sub">vuorossa</div>
        </div>
      </div>
      <div class="jscore-txt" id="jScores"></div>
    </div>

    <div class="answer-box">
      <div class="albl">Oikea vastaus</div>
      <div class="aval" id="jAnswer">–</div>
    </div>

    <div class="judge-img"><img id="judgeImg" alt=""/></div>

    <!-- Small dual timers for judge -->
    <div class="judge-timers" id="judgeTimers"></div>

    <div class="judge-actions">
      <button class="jbtn jok" id="btnOk" onclick="judgeResult('correct')"><span class="bi">✓</span>Oikein</button>
      <button class="jbtn jno" id="btnNo" onclick="judgeResult('wrong')"><span class="bi">✗</span>Väärin</button>
    </div>
  </div>

  <!-- SCOREBOARD -->
  <div id="scoreboard" class="screen">
    <div class="sb-title" id="sbTitle">Pisteet</div>
    <div id="sbRows"></div>
    <div class="sb-sub" id="sbSub"></div>
    <button class="next-btn" id="nextBtn">Seuraava →</button>
  </div>

  <div class="flash" id="flash"></div>
  <div class="toast" id="toast"></div>
  <div id="connecting"><div class="conn-box">Yhdistetään...<br><div class="dots" style="margin-top:.5rem"><span>●</span><span>●</span><span>●</span></div></div></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

// ══════════════════════════════════════════════════════
// STATE
// key idea: two active players per round with SEPARATE timers
// each timer only counts down when it's that player's turn
// ══════════════════════════════════════════════════════
let peer=null, conn=null;
let S={
  role:null,          // 'judge'|'player'
  players:[],         // all players [{name,color,score}]
  selectedCatIds:[],
  catPools:{},        // {catId:[...shuffled questions]}
  // Current match: two players with their own timers
  matchPlayerIdxs:[0,1],  // indices into S.players
  activeSlot:0,           // 0 or 1 – which of the two is answering
  timers:[60,60],         // seconds left for slot 0 and slot 1
  matchScores:[0,0],      // scores this match
  timerInt:null,
  judged:false,
  currentQ:null,
  roundOver:false,
};

// ══════════════════════════════════════════════════════
// PEER
// ══════════════════════════════════════════════════════
function makePeer(id){return id?new Peer(id,{debug:0}):new Peer({debug:0});}
function setupConn(c){
  conn=c;
  conn.on('data',d=>onMsg(d));
  conn.on('close',()=>showToast('Yhteys katkesi'));
  conn.on('error',()=>showToast('Yhteysvirhe'));
}
function send(type,data={}){ if(conn&&conn.open) conn.send({type,...data}); }

// ══════════════════════════════════════════════════════
// UI helpers
// ══════════════════════════════════════════════════════
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function doFlash(cls,txt){
  return new Promise(r=>{
    const f=document.getElementById('flash');
    f.textContent=txt;f.className='flash '+cls+' show';
    setTimeout(()=>{f.className='flash';r();},1100);
  });
}

// ══════════════════════════════════════════════════════
// HOME
// ══════════════════════════════════════════════════════
function toggleJoin(){
  const w=document.getElementById('joinWrap');
  w.classList.toggle('open');
  if(w.classList.contains('open'))setTimeout(()=>document.getElementById('joinCode').focus(),340);
}
function goHome(){
  clearInterval(S.timerInt);
  if(conn){try{conn.close();}catch(e){}}
  if(peer){try{peer.destroy();}catch(e){}}
  conn=null;peer=null;
  S={role:null,players:[],selectedCatIds:[],catPools:{},matchPlayerIdxs:[0,1],activeSlot:0,timers:[60,60],matchScores:[0,0],timerInt:null,judged:false,currentQ:null,roundOver:false};
  document.getElementById('joinCode').value='';
  document.getElementById('joinErr').textContent='';
  document.getElementById('joinWrap').classList.remove('open');
  show('home');
}

// ══════════════════════════════════════════════════════
// CREATE (judge)
// ══════════════════════════════════════════════════════
function createGame(){
  const code=Math.random().toString(36).slice(2,6).toUpperCase();
  S.role='judge';
  document.getElementById('lobbyCode').textContent=code;
  document.getElementById('lobbyNext').style.display='none';
  show('lobby');
  peer=makePeer('floor-'+code);
  peer.on('open',()=>{
    peer.on('connection',c=>{
      setupConn(c);
      c.on('open',()=>{
        document.getElementById('lobbyStatus').textContent='Pelaajapuhelin yhdistetty ✓';
        document.getElementById('lobbyDots').style.display='none';
        document.getElementById('lobbyNext').style.display='block';
        showToast('Pelaajapuhelin liittyi! 🎉');
      });
    });
  });
  peer.on('error',e=>{ showToast('Virhe: '+e.type); console.error(e); });
}

function judgeSetup(){
  buildSetup();
  show('setup');
}

// ══════════════════════════════════════════════════════
// JOIN (player phone)
// ══════════════════════════════════════════════════════
function joinGame(){
  const code=document.getElementById('joinCode').value.trim().toUpperCase();
  document.getElementById('joinErr').textContent='';
  if(code.length!==4){document.getElementById('joinErr').textContent='Anna 4-merkkinen koodi';return;}
  S.role='player';
  show('waiting');
  document.getElementById('connecting').classList.add('show');
  peer=makePeer();
  peer.on('open',()=>{
    const c=peer.connect('floor-'+code,{reliable:true});
    c.on('open',()=>{ document.getElementById('connecting').classList.remove('show'); setupConn(c); });
    setTimeout(()=>{
      if(!conn||!conn.open){
        document.getElementById('connecting').classList.remove('show');
        document.getElementById('joinErr').textContent='Peliä ei löydy koodilla '+code;
        show('home');document.getElementById('joinWrap').classList.add('open');
      }
    },9000);
  });
  peer.on('error',()=>{
    document.getElementById('connecting').classList.remove('show');
    document.getElementById('joinErr').textContent='Yhteysongelma';
    show('home');document.getElementById('joinWrap').classList.add('open');
  });
}

// ══════════════════════════════════════════════════════
// SETUP
// ══════════════════════════════════════════════════════
function buildSetup(){
  S.selectedCatIds=[];
  const rows=document.getElementById('playerRows');
  rows.innerHTML='';
  addPlayerRow('Pelaaja 1');
  addPlayerRow('Pelaaja 2');
  const cg=document.getElementById('catGrid');cg.innerHTML='';
  CATS.forEach(cat=>{
    const d=document.createElement('div');d.className='cat-card';d.dataset.id=cat.id;
    d.innerHTML=`<span class="cicon">${cat.icon}</span><span class="cname">${cat.name}</span><span class="ccount">${cat.questions.length} kuvaa</span>`;
    d.onclick=()=>toggleCat(cat.id,d);cg.appendChild(d);
  });
  checkStart();
}
function addPlayerRow(def=''){
  const idx=document.getElementById('playerRows').children.length;
  const col=P_COLORS[idx%P_COLORS.length];
  const row=document.createElement('div');row.className='player-row';
  row.innerHTML=`<div class="player-dot" style="background:${col}"></div><input class="player-input" placeholder="Nimi" value="${def}" oninput="checkStart()"/><button class="rm-btn" onclick="this.parentElement.remove();checkStart()">✕</button>`;
  document.getElementById('playerRows').appendChild(row);
  checkStart();
}
function toggleCat(id,el){
  if(S.selectedCatIds.includes(id)){S.selectedCatIds=S.selectedCatIds.filter(c=>c!==id);el.classList.remove('sel');}
  else if(S.selectedCatIds.length<4){S.selectedCatIds.push(id);el.classList.add('sel');}
  checkStart();
}
function checkStart(){
  const n=Array.from(document.querySelectorAll('.player-input')).map(i=>i.value.trim()).filter(Boolean).length;
  document.getElementById('startBtn').disabled=n<2||S.selectedCatIds.length===0;
}

// ══════════════════════════════════════════════════════
// START
// ══════════════════════════════════════════════════════
function startGame(){
  const names=Array.from(document.querySelectorAll('.player-input')).map(i=>i.value.trim()).filter(Boolean);
  S.players=names.map((n,i)=>({name:n,color:P_COLORS[i%P_COLORS.length],score:0}));

  // Build category question pools
  S.catPools={};
  S.selectedCatIds.forEach(cid=>{
    const cat=CATS.find(c=>c.id===cid);
    S.catPools[cid]=shuffle([...cat.questions]);
  });

  // First match: players[0] vs players[1]
  S.matchPlayerIdxs=[0,1];
  S.matchScores=[0,0];
  S.timers=[60,60];
  S.activeSlot=0;

  const payload={players:S.players,catPools:S.catPools,selectedCatIds:S.selectedCatIds,
    matchPlayerIdxs:S.matchPlayerIdxs,matchScores:S.matchScores,timers:S.timers,activeSlot:S.activeSlot};
  send('game_start',payload);
  beginTurn();
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function pickQ(){
  // Pick random cat with remaining questions
  const avail=S.selectedCatIds.filter(cid=>S.catPools[cid]&&S.catPools[cid].length>0);
  if(!avail.length){
    S.selectedCatIds.forEach(cid=>{const cat=CATS.find(c=>c.id===cid);S.catPools[cid]=shuffle([...cat.questions]);});
    return pickQ();
  }
  const cid=avail[Math.floor(Math.random()*avail.length)];
  const cat=CATS.find(c=>c.id===cid);
  const q=S.catPools[cid].pop();
  return {...q,cat:cat.name,icon:cat.icon};
}

// ══════════════════════════════════════════════════════
// TURN LOGIC
// Key: activeSlot's timer counts down. On correct: give point,
// switch slot (other timer continues from where it was), new image.
// On wrong: new image, same slot, timer continues.
// Timer hits 0: that player loses the match.
// ══════════════════════════════════════════════════════
function beginTurn(){
  clearInterval(S.timerInt);
  S.judged=false;
  S.roundOver=false;
  S.currentQ=pickQ();

  pushState(); // send to player phone + update judge UI
  startTimer();
}

function startTimer(){
  clearInterval(S.timerInt);
  S.timerInt=setInterval(()=>{
    S.timers[S.activeSlot]--;
    // send tick
    send('tick',{timers:S.timers,activeSlot:S.activeSlot});
    renderTimers(S.timers,S.activeSlot);
    updateJudgeTimers();
    if(S.timers[S.activeSlot]<=0){
      clearInterval(S.timerInt);
      if(S.role==='judge') judgeResult('timeout');
    }
  },1000);
}

// Push full state to player phone and update judge display
function pushState(){
  const state={
    q:S.currentQ,
    players:S.players,
    matchPlayerIdxs:S.matchPlayerIdxs,
    timers:[...S.timers],
    activeSlot:S.activeSlot,
    matchScores:[...S.matchScores],
  };
  send('state',state);
  if(S.role==='judge') applyJudgeState();
  if(S.role==='player') applyPlayerState(state);
}

// ── Judge UI ──────────────────────────────────────────
function applyJudgeState(){
  const slot=S.activeSlot;
  const pidx=S.matchPlayerIdxs[slot];
  const p=S.players[pidx];
  document.getElementById('jActiveDot').style.background=p.color;
  document.getElementById('jActiveName').textContent=p.name;
  document.getElementById('jAnswer').textContent=S.currentQ.a;
  const ji=document.getElementById('judgeImg');ji.src=S.currentQ.img;ji.style.display='block';
  document.getElementById('btnOk').disabled=false;
  document.getElementById('btnNo').disabled=false;
  updateJScores();
  buildJudgeTimersUI();
  updateJudgeTimers();
  show('judgescreen');
}

function updateJScores(){
  const txt=S.matchPlayerIdxs.map((pi,slot)=>`${S.players[pi].name} ${S.matchScores[slot]}`).join(' · ');
  document.getElementById('jScores').textContent=txt;
}

const CJT=2*Math.PI*14; // small judge timer arc circumference (r=14 on 36px svg)
function buildJudgeTimersUI(){
  const wrap=document.getElementById('judgeTimers');
  wrap.innerHTML='';
  S.matchPlayerIdxs.forEach((pi,slot)=>{
    const p=S.players[pi];
    const div=document.createElement('div');div.className='jt-block';
    div.innerHTML=`
      <div class="jt-name" style="color:${p.color}">${p.name}</div>
      <svg class="jt-arc" viewBox="0 0 36 36" style="transform:rotate(-90deg)">
        <circle class="jt-track" cx="18" cy="18" r="14"/>
        <circle class="jt-fill" id="jtArc${slot}" cx="18" cy="18" r="14"/>
      </svg>
      <div class="jt-num" id="jtNum${slot}" style="color:${p.color}">${S.timers[slot]}</div>`;
    wrap.appendChild(div);
  });
}
function updateJudgeTimers(){
  S.timers.forEach((t,slot)=>{
    const arc=document.getElementById('jtArc'+slot);
    const num=document.getElementById('jtNum'+slot);
    if(!arc||!num)return;
    const col=t>20?'#2d8a4e':t>10?'#c8a84b':'#d63b2f';
    arc.style.strokeDasharray=CJT;
    arc.style.strokeDashoffset=CJT*(1-t/60);
    arc.style.stroke=col;
    num.textContent=t;
    num.style.color=col;
  });
}

// ── Player UI ──────────────────────────────────────────
function applyPlayerState(state){
  const {players,matchPlayerIdxs,timers,activeSlot,q,matchScores}=state;

  // Build timer strip if needed
  buildTimerStrip(matchPlayerIdxs,players);
  renderTimers(timers,activeSlot);

  // Image
  const pi=document.getElementById('playerImg'),pp=document.getElementById('playerPh');
  pi.style.display='none';pp.style.display='flex';pp.textContent='📷';
  pi.onload=()=>{pi.style.display='block';pp.style.display='none';};
  pi.onerror=()=>{pp.textContent='❓';};
  pi.src='';pi.src=q.img;
  document.getElementById('playerCat').textContent=q.icon+' '+q.cat;
  show('playerscreen');
}

const CARC=2*Math.PI*18; // r=18 on side arc (44px svg)
function buildTimerStrip(matchPlayerIdxs,players){
  const strip=document.getElementById('timerStrip');
  // Only rebuild if players changed
  const key=matchPlayerIdxs.join('-');
  if(strip.dataset.key===key)return;
  strip.dataset.key=key;
  strip.innerHTML='';
  matchPlayerIdxs.forEach((pi,slot)=>{
    const p=players[pi];
    if(slot===1){ const div=document.createElement('div');div.className='vs-divider';strip.appendChild(div); }
    const block=document.createElement('div');
    block.className='p-timer';block.id='pTimerBlock'+slot;
    block.innerHTML=`
      <div class="p-timer-name" id="pTimerName${slot}" style="color:${p.color}">${p.name}</div>
      <svg class="arc-svg" viewBox="0 0 44 44" style="transform:rotate(-90deg)">
        <circle class="arc-track" cx="22" cy="22" r="18"/>
        <circle class="arc-fill" id="pArc${slot}" cx="22" cy="22" r="18"/>
      </svg>
      <div class="p-timer-num" id="pNum${slot}">${S.timers[slot]}</div>
      <div class="active-indicator" id="pInd${slot}" style="display:none"></div>`;
    if(slot===0) strip.prepend(block); else strip.appendChild(block);
  });
}

function renderTimers(timers,activeSlot){
  timers.forEach((t,slot)=>{
    const arc=document.getElementById('pArc'+slot);
    const num=document.getElementById('pNum'+slot);
    const block=document.getElementById('pTimerBlock'+slot);
    const ind=document.getElementById('pInd'+slot);
    if(!arc)return;
    const col=t>20?'#2d8a4e':t>10?'#c8a84b':'#d63b2f';
    arc.style.strokeDasharray=CARC;
    arc.style.strokeDashoffset=CARC*(1-t/60);
    arc.style.stroke=col;
    num.textContent=t;
    num.style.color=col;
    if(block){block.className='p-timer '+(slot===activeSlot?'active-side':'inactive-side');}
    if(ind){ind.style.display=slot===activeSlot?'block':'none';}
  });
}

// ══════════════════════════════════════════════════════
// MESSAGES
// ══════════════════════════════════════════════════════
function onMsg(msg){
  if(msg.type==='game_start'&&S.role==='player'){
    S.players=msg.players;
    S.catPools=msg.catPools;
    S.selectedCatIds=msg.selectedCatIds;
    S.matchPlayerIdxs=msg.matchPlayerIdxs;
    S.matchScores=msg.matchScores;
    S.timers=msg.timers;
    S.activeSlot=msg.activeSlot;
    show('playerscreen');
  }
  if(msg.type==='state'&&S.role==='player'){
    S.timers=msg.timers;
    S.activeSlot=msg.activeSlot;
    S.matchPlayerIdxs=msg.matchPlayerIdxs;
    S.matchScores=msg.matchScores;
    applyPlayerState(msg);
  }
  if(msg.type==='tick'&&S.role==='player'){
    S.timers=msg.timers;
    S.activeSlot=msg.activeSlot;
    renderTimers(msg.timers,msg.activeSlot);
  }
  if(msg.type==='flash'){
    doFlash(msg.cls,msg.txt);
  }
  if(msg.type==='scoreboard'&&S.role==='player'){
    showScoreboard(msg.title,msg.sub,false);
  }
}

// ══════════════════════════════════════════════════════
// JUDGE ACTIONS
// ══════════════════════════════════════════════════════
async function judgeResult(outcome){
  if(S.judged||S.roundOver)return;
  S.judged=true;
  clearInterval(S.timerInt);
  document.getElementById('btnOk').disabled=true;
  document.getElementById('btnNo').disabled=true;

  if(outcome==='correct'){
    // Point to active player
    S.matchScores[S.activeSlot]++;
    send('flash',{cls:'ok',txt:'✓ OIKEIN!'});
    await doFlash('ok','✓ OIKEIN!');
    // Switch active slot – other player's timer continues from where it was
    S.activeSlot=S.activeSlot===0?1:0;
    S.judged=false;
    S.currentQ=pickQ();
    pushState();
    startTimer();
    return;
  }

  if(outcome==='wrong'){
    send('flash',{cls:'no',txt:'✗ VÄÄRIN'});
    await doFlash('no','✗ VÄÄRIN');
    // Same player, new image from same category pool, timer continues
    S.judged=false;
    S.currentQ=pickQ();
    pushState();
    startTimer();
    return;
  }

  if(outcome==='timeout'){
    // Active player's timer hit 0 – they lose the match
    const loserSlot=S.activeSlot;
    const winnerSlot=loserSlot===0?1:0;
    const loser=S.players[S.matchPlayerIdxs[loserSlot]];
    const winner=S.players[S.matchPlayerIdxs[winnerSlot]];
    send('flash',{cls:'time',txt:'⏱ AIKA!\n'+loser.name+' hävisi'});
    await doFlash('time','⏱ AIKA!');
    S.roundOver=true;
    // Add match scores to global scores
    S.players[S.matchPlayerIdxs[0]].score+=S.matchScores[0];
    S.players[S.matchPlayerIdxs[1]].score+=S.matchScores[1];
    // Show scoreboard
    const sub=winner.name+' voitti erän! Kokonaispisteillä:';
    send('scoreboard',{title:'Erä päättyi! 🏁',sub});
    showScoreboard('Erä päättyi! 🏁',sub,true,loser,winner);
  }
}

function showScoreboard(title,sub,isJudge,loser,winner){
  const sorted=[...S.players].sort((a,b)=>b.score-a.score);
  document.getElementById('sbTitle').textContent=title;
  document.getElementById('sbRows').innerHTML=sorted.map((p,i)=>`
    <div class="sb-row ${i===0?'winner':''}">
      <span class="sn">
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${p.color}"></span>
        ${p.name}${p===loser?' ⏱':''}${p===winner?' ✓':''}
      </span>
      <span class="sp">${p.score}</span>
    </div>`).join('');
  document.getElementById('sbSub').textContent=sub||'';
  const nb=document.getElementById('nextBtn');
  if(isJudge){
    nb.style.display='block';
    nb.textContent='Seuraava erä →';
    nb.onclick=nextMatch;
  } else {
    nb.style.display='none';
  }
  show('scoreboard');
}

function nextMatch(){
  // Rotate to next pair
  const n=S.players.length;
  // Next two players (rotate by 1 each match)
  const firstIdx=(S.matchPlayerIdxs[0]+1)%n;
  const secondIdx=(firstIdx+1)%n;
  S.matchPlayerIdxs=[firstIdx,secondIdx];
  S.matchScores=[0,0];
  S.timers=[60,60];
  S.activeSlot=0;
  S.roundOver=false;
  const payload={players:S.players,catPools:S.catPools,selectedCatIds:S.selectedCatIds,
    matchPlayerIdxs:S.matchPlayerIdxs,matchScores:S.matchScores,timers:S.timers,activeSlot:S.activeSlot};
  send('game_start',payload);
  beginTurn();
}
</script>
