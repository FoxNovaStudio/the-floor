<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Floor</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0a;--white:#f5f0e8;--gold:#c8a84b;--red:#d63b2f;--green:#2d8a4e;--gray:#1e1e1e;--gray2:#2a2a2a;--gray3:#3d3d3d;--muted:#777}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;width:100%;background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;height:100%;align-items:center;justify-content:center;padding:2rem}
.screen.active{display:flex}

/* ── HOME ── */
#home{background:var(--black);position:relative;overflow:hidden}
#home::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#c8a84b18,transparent 65%);pointer-events:none}
.logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(76px,23vw,112px);color:var(--gold);line-height:.88;text-align:center;letter-spacing:.04em}
.logo-sub{font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--muted);margin-top:.4rem;margin-bottom:3rem;text-align:center}
.btn{width:100%;max-width:300px;padding:17px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;letter-spacing:.03em;cursor:pointer;border:none;transition:transform .1s;margin-bottom:10px;position:relative;z-index:1}
.btn:active{transform:scale(.95)}
.btn-gold{background:var(--gold);color:var(--black)}
.btn-outline{background:transparent;color:var(--white);border:1.5px solid var(--gray3)}
.join-wrap{width:100%;max-width:300px;overflow:hidden;max-height:0;transition:max-height .35s ease;position:relative;z-index:1}
.join-wrap.open{max-height:180px}
.code-input{width:100%;background:var(--gray2);border:1.5px solid var(--gray3);border-radius:6px;color:var(--white);font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:.22em;text-align:center;padding:13px 8px;text-transform:uppercase;margin-top:8px}
.code-input:focus{outline:none;border-color:var(--gold)}
.go-btn{width:100%;margin-top:8px;background:var(--gold);color:var(--black);border:none;border-radius:6px;padding:15px;font-size:16px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer}
.go-btn:active{transform:scale(.95)}
.err{color:var(--red);font-size:13px;text-align:center;margin-top:6px;min-height:16px}

/* ── LOBBY ── */
#lobby{gap:.6rem;text-align:center}
.lbl{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.room-code{font-family:'Bebas Neue',sans-serif;font-size:clamp(88px,26vw,128px);color:var(--gold);letter-spacing:.14em;line-height:1}
.dots span{display:inline-block;animation:dot 1.4s infinite;color:var(--gold);font-size:18px;margin:0 2px}
.dots span:nth-child(2){animation-delay:.22s}.dots span:nth-child(3){animation-delay:.44s}
@keyframes dot{0%,80%,100%{opacity:0}40%{opacity:1}}
.back-btn{margin-top:1rem;background:transparent;color:var(--muted);border:1px solid var(--gray3);border-radius:6px;padding:11px 26px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}

/* ── CAT SELECT ── */
#catselect{align-items:stretch;padding:0;justify-content:flex-start}
.top-bar{padding:1.25rem 1rem .6rem;flex-shrink:0}
.stitle{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--gold);letter-spacing:.08em}
.ssub{font-size:13px;color:var(--muted);margin-top:2px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 1rem;overflow-y:auto;flex:1}
.cat-card{background:var(--gray);border:1.5px solid var(--gray2);border-radius:8px;padding:16px 12px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;flex-direction:column;gap:4px;user-select:none}
.cat-card.sel{border-color:var(--gold);background:#1b1500}
.cicon{font-size:28px}.cname{font-size:14px;font-weight:600}.ccount{font-size:11px;color:var(--muted)}
.start-bar{padding:1rem;border-top:1px solid var(--gray2);flex-shrink:0;width:100%}
.start-bar button{width:100%;background:var(--gold);color:var(--black);border:none;border-radius:6px;padding:17px;font-size:17px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer}
.start-bar button:disabled{opacity:.3;cursor:not-allowed}

/* ── WAITING ── */
#waiting{gap:1.5rem;text-align:center}

/* ── PLAYER SCREEN ── */
#playerscreen{align-items:stretch;justify-content:flex-start;padding:0}
.game-header{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1rem;background:var(--gray2);flex-shrink:0}
.gcatname{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);letter-spacing:.07em}
.gscore{font-size:13px;color:var(--muted)}
.timer-center{display:flex;align-items:center;justify-content:center;padding:.7rem 0 .2rem;flex-shrink:0;position:relative}
.timer-center svg{transform:rotate(-90deg)}
.t-track{fill:none;stroke:var(--gray2);stroke-width:7}
.t-fill{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .5s}
.t-num{position:absolute;font-family:'Bebas Neue',sans-serif;font-size:44px;color:var(--white)}
.img-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem;overflow:hidden;min-height:0}
.qimg{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;display:none}
.img-ph{width:100%;height:160px;background:var(--gray);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:44px}
.guess-hint{text-align:center;padding:.4rem 1rem 1.1rem;font-size:14px;color:var(--muted);flex-shrink:0}

/* ── JUDGE SCREEN ── */
#judgescreen{align-items:stretch;justify-content:flex-start;padding:0}
.answer-box{margin:1rem 1rem .4rem;background:var(--gray);border-radius:10px;padding:1.25rem 1rem;text-align:center;flex-shrink:0}
.albl{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.aval{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,12vw,62px);color:var(--gold);letter-spacing:.05em;line-height:1.05}
.judge-img{flex:1;min-height:0;overflow:hidden;padding:0 1.5rem;display:flex;align-items:center;justify-content:center}
.judge-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;opacity:.38;display:none}
.jtimer-row{display:flex;justify-content:center;padding:.4rem 0;flex-shrink:0;position:relative}
.jtimer-row svg{transform:rotate(-90deg)}
.judge-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:1rem;flex-shrink:0}
.jbtn{padding:20px 8px;border-radius:10px;border:none;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .1s,opacity .15s}
.jbtn:active{transform:scale(.94)}.jbtn:disabled{opacity:.35;cursor:not-allowed}
.jbtn .bi{font-size:26px}
.jok{background:var(--green);color:#fff}.jno{background:var(--red);color:#fff}

/* ── SCOREBOARD ── */
#scoreboard{align-items:stretch;justify-content:flex-start;padding:1.5rem;overflow-y:auto;gap:.6rem}
.sb-title{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--gold);letter-spacing:.08em}
.sb-row{background:var(--gray);border-radius:8px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sb-row .sn{font-weight:600;font-size:15px}.sb-row .sp{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--gold)}
.sb-row.winner{border:2px solid var(--gold)}
.sb-sub{font-size:13px;color:var(--muted);text-align:center}
.next-btn{background:var(--gold);color:var(--black);border:none;border-radius:6px;padding:17px;font-size:17px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:auto;width:100%}
.next-btn:active{transform:scale(.97)}

/* ── FLASH ── */
.flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:76px;letter-spacing:.05em;z-index:200;pointer-events:none;opacity:0;transition:opacity .12s}
.flash.show{opacity:1}
.flash.ok{background:#2d8a4ecc;color:#fff}
.flash.no{background:#d63b2fcc;color:#fff}
.flash.time{background:#c8a84bcc;color:var(--black)}

/* ── TOAST ── */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--gray3);color:var(--white);padding:10px 22px;border-radius:999px;font-size:14px;z-index:300;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}

/* ── CONNECTING OVERLAY ── */
#connecting{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:400;display:none}
#connecting.show{display:flex}
.conn-box{background:var(--gray);border-radius:10px;padding:2rem;text-align:center;font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div id="home" class="screen active">
    <div class="logo">THE<br>FLOOR</div>
    <div class="logo-sub">Kuvatunnistuspeli</div>
    <button class="btn btn-gold" onclick="createGame()">Luo peli</button>
    <button class="btn btn-outline" onclick="toggleJoin()">Liity peliin</button>
    <div class="join-wrap" id="joinWrap">
      <input class="code-input" id="joinCode" maxlength="4" placeholder="KOODI"
        oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')" />
      <button class="go-btn" onclick="joinGame()">Liity →</button>
      <div class="err" id="joinErr"></div>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="screen">
    <div class="lbl">Pelin koodi – jaa kaverille</div>
    <div class="room-code" id="lobbyCode">----</div>
    <div class="lbl" style="margin-top:.4rem">Odotetaan toista pelaajaa</div>
    <div class="dots"><span>●</span><span>●</span><span>●</span></div>
    <button class="back-btn" onclick="goHome()">← Peruuta</button>
  </div>

  <!-- CAT SELECT -->
  <div id="catselect" class="screen">
    <div class="top-bar">
      <div class="stitle">Valitse kategoriat</div>
      <div class="ssub">Valitse 1–4 kategoriaa</div>
    </div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="start-bar">
      <button id="startBtn" onclick="startGame()" disabled>Aloita peli</button>
    </div>
  </div>

  <!-- WAITING -->
  <div id="waiting" class="screen">
    <div style="font-size:64px">✅</div>
    <div class="lbl" style="font-size:15px;letter-spacing:.1em">Liitytty peliin!</div>
    <div class="lbl">Isäntä valitsee kategoriat...</div>
    <div class="dots"><span>●</span><span>●</span><span>●</span></div>
  </div>

  <!-- PLAYER SCREEN -->
  <div id="playerscreen" class="screen">
    <div class="game-header">
      <div class="gcatname" id="pCat">–</div>
      <div class="gscore" id="pScore">0 pistettä</div>
    </div>
    <div class="timer-center">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle class="t-track" cx="48" cy="48" r="40"/>
        <circle class="t-fill" id="pFill" cx="48" cy="48" r="40"/>
      </svg>
      <div class="t-num" id="pNum">60</div>
    </div>
    <div class="img-wrap">
      <img class="qimg" id="playerImg" alt="Tunnista!"/>
      <div class="img-ph" id="playerPh">📷</div>
    </div>
    <div class="guess-hint">Mikä tämä on? Sano ääneen! 🎤</div>
  </div>

  <!-- JUDGE SCREEN -->
  <div id="judgescreen" class="screen">
    <div class="game-header">
      <div class="gcatname" id="jCat">–</div>
      <div class="gscore" id="jScore">0 – 0</div>
    </div>
    <div class="answer-box">
      <div class="albl">Oikea vastaus</div>
      <div class="aval" id="jAnswer">–</div>
    </div>
    <div class="judge-img">
      <img id="judgeImg" alt=""/>
    </div>
    <div class="jtimer-row">
      <div style="position:relative;display:inline-flex;align-items:center;justify-content:center">
        <svg width="80" height="80" viewBox="0 0 80 80" style="transform:rotate(-90deg)">
          <circle class="t-track" cx="40" cy="40" r="33"/>
          <circle class="t-fill" id="jFill" cx="40" cy="40" r="33"/>
        </svg>
        <div class="t-num" id="jNum" style="font-size:36px">60</div>
      </div>
    </div>
    <div class="judge-actions">
      <button class="jbtn jok" id="btnOk" onclick="judgeResult('correct')"><span class="bi">✓</span>Oikein</button>
      <button class="jbtn jno" id="btnNo" onclick="judgeResult('wrong')"><span class="bi">✗</span>Väärin</button>
    </div>
  </div>

  <!-- SCOREBOARD -->
  <div id="scoreboard" class="screen">
    <div class="sb-title" id="sbTitle">Kierros ohi!</div>
    <div id="sbRows"></div>
    <div class="sb-sub" id="sbSub"></div>
    <button class="next-btn" id="nextBtn">Seuraava →</button>
  </div>

  <div class="flash" id="flash"></div>
  <div class="toast" id="toast"></div>
  <div id="connecting"><div class="conn-box">Yhdistetään...<br><div class="dots" style="margin-top:.5rem"><span>●</span><span>●</span><span>●</span></div></div></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

// ════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════
let peer = null, conn = null;
let S = { role:null, selectedCats:[], questions:[], qIdx:0, scores:{host:0,player:0}, timerInt:null, timeLeft:60, judged:false };

// ════════════════════════════════════════════════════
//  PEERJS
// ════════════════════════════════════════════════════
function makePeer(id) {
  // Use public PeerJS cloud server – no account needed
  return new Peer(id, { debug: 0 });
}

function setupConnHandlers(c) {
  conn = c;
  conn.on('data', d => onMsg(d));
  conn.on('close', () => { showToast('Yhteys katkesi'); });
  conn.on('error', e => { showToast('Virhe: '+e); });
}

function send(type, data={}) {
  if(conn && conn.open) conn.send({type,...data});
}

// ════════════════════════════════════════════════════
//  UI HELPERS
// ════════════════════════════════════════════════════
function show(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

// ════════════════════════════════════════════════════
//  HOME
// ════════════════════════════════════════════════════
function toggleJoin() {
  const w = document.getElementById('joinWrap');
  w.classList.toggle('open');
  if(w.classList.contains('open')) setTimeout(()=>document.getElementById('joinCode').focus(), 340);
}

function goHome() {
  clearInterval(S.timerInt);
  if(conn) { try{conn.close();}catch(e){} conn=null; }
  if(peer) { try{peer.destroy();}catch(e){} peer=null; }
  S = {role:null,selectedCats:[],questions:[],qIdx:0,scores:{host:0,player:0},timerInt:null,timeLeft:60,judged:false};
  document.getElementById('joinCode').value='';
  document.getElementById('joinErr').textContent='';
  document.getElementById('joinWrap').classList.remove('open');
  show('home');
}

// ════════════════════════════════════════════════════
//  CREATE
// ════════════════════════════════════════════════════
function createGame() {
  const code = Math.random().toString(36).slice(2,6).toUpperCase();
  S.role = 'host';
  document.getElementById('lobbyCode').textContent = code;
  show('lobby');

  peer = makePeer('floor-'+code);
  peer.on('open', () => {
    peer.on('connection', c => {
      setupConnHandlers(c);
      c.on('open', () => {
        showToast('Pelaaja liittyi! 🎉');
        buildCatGrid();
        show('catselect');
      });
    });
  });
  peer.on('error', e => {
    showToast('Virhe: '+e.type);
    console.error(e);
  });
}

// ════════════════════════════════════════════════════
//  JOIN
// ════════════════════════════════════════════════════
function joinGame() {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  document.getElementById('joinErr').textContent = '';
  if(code.length !== 4) { document.getElementById('joinErr').textContent='Anna 4-merkkinen koodi'; return; }

  S.role = 'player';
  show('waiting');
  document.getElementById('connecting').classList.add('show');

  peer = makePeer(); // random id for player
  peer.on('open', () => {
    const c = peer.connect('floor-'+code, {reliable:true});
    c.on('open', () => {
      document.getElementById('connecting').classList.remove('show');
      setupConnHandlers(c);
    });
    c.on('error', e => {
      document.getElementById('connecting').classList.remove('show');
      showToast('Ei löydy peliä koodilla '+code);
      goHome();
    });
    setTimeout(()=>{
      if(!conn || !conn.open) {
        document.getElementById('connecting').classList.remove('show');
        document.getElementById('joinErr').textContent='Peliä ei löydy – tarkista koodi';
        show('home'); document.getElementById('joinWrap').classList.add('open');
      }
    }, 8000);
  });
  peer.on('error', e => {
    document.getElementById('connecting').classList.remove('show');
    document.getElementById('joinErr').textContent='Virhe yhteydenmuodostuksessa';
    show('home'); document.getElementById('joinWrap').classList.add('open');
  });
}

// ════════════════════════════════════════════════════
//  MESSAGES
// ════════════════════════════════════════════════════
function onMsg(msg) {
  if(msg.type==='game_start' && S.role==='player') {
    S.questions=msg.questions; S.scores={host:0,player:0}; S.qIdx=0;
    showQ();
  }
  if(msg.type==='tick' && S.role==='player') { updateTimers(msg.t); }
  if(msg.type==='result') { applyResult(msg); }
  if(msg.type==='next' && S.role==='player') { S.qIdx=msg.qIdx; S.scores=msg.scores; showQ(); }
}

// ════════════════════════════════════════════════════
//  CAT SELECT
// ════════════════════════════════════════════════════
function buildCatGrid() {
  S.selectedCats=[];
  const g=document.getElementById('catGrid'); g.innerHTML='';
  CATS.forEach(cat=>{
    const d=document.createElement('div'); d.className='cat-card'; d.dataset.id=cat.id;
    d.innerHTML=`<span class="cicon">${cat.icon}</span><span class="cname">${cat.name}</span><span class="ccount">${cat.questions.length} kuvaa</span>`;
    d.onclick=()=>toggleCat(cat.id,d); g.appendChild(d);
  });
  document.getElementById('startBtn').disabled=true;
}
function toggleCat(id,el) {
  if(S.selectedCats.includes(id)){ S.selectedCats=S.selectedCats.filter(c=>c!==id); el.classList.remove('sel'); }
  else if(S.selectedCats.length<4){ S.selectedCats.push(id); el.classList.add('sel'); }
  document.getElementById('startBtn').disabled=S.selectedCats.length===0;
}

// ════════════════════════════════════════════════════
//  START
// ════════════════════════════════════════════════════
function startGame() {
  let qs=[];
  S.selectedCats.forEach(cid=>{
    const cat=CATS.find(c=>c.id===cid);
    if(cat) cat.questions.forEach(q=>qs.push({...q,cat:cat.name,icon:cat.icon}));
  });
  for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}
  S.questions=qs; S.qIdx=0; S.scores={host:0,player:0};
  send('game_start',{questions:qs});
  showQ();
}

// ════════════════════════════════════════════════════
//  SHOW QUESTION
// ════════════════════════════════════════════════════
const CP=2*Math.PI*40, CJ=2*Math.PI*33;

function showQ() {
  clearInterval(S.timerInt); S.judged=false;
  if(S.qIdx>=S.questions.length){ showFinal(); return; }
  const q=S.questions[S.qIdx];

  if(S.role==='host') {
    document.getElementById('jCat').textContent=q.icon+' '+q.cat;
    document.getElementById('jScore').textContent=`Host ${S.scores.host} – ${S.scores.player} Pelaaja`;
    document.getElementById('jAnswer').textContent=q.a;
    const ji=document.getElementById('judgeImg'); ji.src=q.img; ji.style.display='block';
    document.getElementById('btnOk').disabled=false;
    document.getElementById('btnNo').disabled=false;
    show('judgescreen');
  } else {
    document.getElementById('pCat').textContent=q.icon+' '+q.cat;
    document.getElementById('pScore').textContent=`Pisteet: ${S.scores.player}`;
    const pi=document.getElementById('playerImg'), pp=document.getElementById('playerPh');
    pi.style.display='none'; pp.style.display='flex'; pp.textContent='📷';
    pi.onload=()=>{ pi.style.display='block'; pp.style.display='none'; };
    pi.onerror=()=>{ pp.textContent='❓'; };
    pi.src=''; pi.src=q.img;
    show('playerscreen');
  }

  S.timeLeft=60; updateTimers(60);
  S.timerInt=setInterval(()=>{
    S.timeLeft--;
    updateTimers(S.timeLeft);
    if(S.role==='host') send('tick',{t:S.timeLeft});
    if(S.timeLeft<=0){ clearInterval(S.timerInt); if(S.role==='host') judgeResult('timeout'); }
  },1000);
}

function updateTimers(t) {
  const pct=t/60, col=t>20?'#2d8a4e':t>10?'#c8a84b':'#d63b2f';
  const pf=document.getElementById('pFill'), jf=document.getElementById('jFill');
  if(pf){pf.style.strokeDasharray=CP;pf.style.strokeDashoffset=CP*(1-pct);pf.style.stroke=col;}
  if(jf){jf.style.strokeDasharray=CJ;jf.style.strokeDashoffset=CJ*(1-pct);jf.style.stroke=col;}
  document.getElementById('pNum').textContent=t;
  document.getElementById('jNum').textContent=t;
}

// ════════════════════════════════════════════════════
//  JUDGE
// ════════════════════════════════════════════════════
function judgeResult(outcome) {
  if(S.judged) return; S.judged=true;
  clearInterval(S.timerInt);
  document.getElementById('btnOk').disabled=true;
  document.getElementById('btnNo').disabled=true;
  if(outcome==='correct') S.scores.player++;
  const payload={type:'result',outcome,scores:S.scores,qIdx:S.qIdx};
  send('result',{outcome,scores:S.scores,qIdx:S.qIdx});
  applyResult(payload);
}

function applyResult({outcome,scores,qIdx}) {
  clearInterval(S.timerInt); S.scores=scores;
  const fl=document.getElementById('flash');
  if(outcome==='correct'){fl.textContent='✓ OIKEIN!';fl.className='flash ok show';}
  else if(outcome==='wrong'){fl.textContent='✗ VÄÄRIN';fl.className='flash no show';}
  else{fl.textContent='⏱ AIKA!';fl.className='flash time show';}
  setTimeout(()=>{ fl.className='flash'; showRound(outcome,qIdx); },1300);
}

function showRound(outcome,qIdx) {
  const q=S.questions[qIdx];
  document.getElementById('sbTitle').textContent=outcome==='correct'?'✓ Oikein!':outcome==='wrong'?'✗ Väärin':'⏱ Aika loppui';
  document.getElementById('sbRows').innerHTML=`
    <div class="sb-row" style="margin-bottom:10px">
      <span class="sn">Oikea vastaus</span>
      <span style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold)">${q.a}</span>
    </div>
    <div class="sb-row"><span class="sn">Pelaaja</span><span class="sp">${S.scores.player}</span></div>
    <div class="sb-row" style="margin-top:8px"><span class="sn">Host</span><span class="sp">${S.scores.host}</span></div>`;
  document.getElementById('sbSub').textContent=`Kuva ${qIdx+1} / ${S.questions.length}`;
  const nb=document.getElementById('nextBtn');
  nb.textContent=qIdx>=S.questions.length-1?'Lopputulos →':'Seuraava kuva →';
  nb.onclick=nextQ;
  nb.style.display=S.role==='host'?'block':'none';
  show('scoreboard');
}

function nextQ() {
  S.qIdx++;
  send('next',{qIdx:S.qIdx,scores:S.scores});
  showQ();
}

function showFinal() {
  const pw=S.scores.player>S.scores.host, tie=S.scores.player===S.scores.host;
  document.getElementById('sbTitle').textContent=tie?'Tasapeli! 🤝':pw?'Pelaaja voitti! 🏆':'Host voitti! 🏆';
  document.getElementById('sbRows').innerHTML=`
    <div class="sb-row ${pw||tie?'winner':''}"><span class="sn">Pelaaja</span><span class="sp">${S.scores.player}</span></div>
    <div class="sb-row ${!pw&&!tie?'winner':''}"><span class="sn">Host</span><span class="sp">${S.scores.host}</span></div>`;
  document.getElementById('sbSub').textContent='Peli ohi!';
  const nb=document.getElementById('nextBtn');
  nb.textContent='Uusi peli'; nb.onclick=goHome; nb.style.display='block';
  show('scoreboard');
}
</script>
