<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0a0a0a;
  --white: #f5f0e8;
  --gold: #c8a84b;
  --gold-light: #e8c96a;
  --red: #d63b2f;
  --green: #2d8a4e;
  --gray: #2a2a2a;
  --gray2: #3d3d3d;
  --text-muted: #888;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; width: 100%;
  background: var(--black);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  overflow: hidden;
}
#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* SCREENS */
.screen { display: none; flex-direction: column; height: 100%; padding: 0; }
.screen.active { display: flex; }

/* HOME */
#home {
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 2rem;
  background: var(--black);
  position: relative;
  overflow: hidden;
}
#home::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 30%, #c8a84b18 0%, transparent 70%);
  pointer-events: none;
}
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(64px, 20vw, 96px);
  letter-spacing: 0.05em;
  color: var(--gold);
  line-height: 1;
  text-align: center;
  margin-bottom: 0.25rem;
}
.logo-sub {
  font-size: 13px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 3rem;
  text-align: center;
}
.home-btn {
  width: 100%;
  max-width: 320px;
  padding: 18px;
  border-radius: 4px;
  font-family: 'DM Sans', sans-serif;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.05em;
  cursor: pointer;
  border: none;
  transition: transform 0.1s, opacity 0.1s;
  margin-bottom: 12px;
}
.home-btn:active { transform: scale(0.97); }
.btn-create {
  background: var(--gold);
  color: var(--black);
}
.btn-join {
  background: transparent;
  color: var(--white);
  border: 1.5px solid var(--gray2);
}
.join-input-wrap {
  width: 100%;
  max-width: 320px;
  display: none;
  flex-direction: column;
  gap: 10px;
  margin-top: 4px;
}
.join-input-wrap.visible { display: flex; }
.code-input {
  background: var(--gray);
  border: 1.5px solid var(--gray2);
  border-radius: 4px;
  color: var(--white);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 0.2em;
  text-align: center;
  padding: 14px;
  text-transform: uppercase;
  width: 100%;
}
.code-input:focus { outline: none; border-color: var(--gold); }
.btn-go {
  background: var(--gold);
  color: var(--black);
  border: none;
  border-radius: 4px;
  padding: 16px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: transform 0.1s;
}
.btn-go:active { transform: scale(0.97); }

/* LOBBY */
#lobby {
  align-items: center;
  justify-content: center;
  padding: 2rem;
  gap: 1rem;
  text-align: center;
}
.room-code {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(72px, 22vw, 108px);
  color: var(--gold);
  letter-spacing: 0.1em;
  line-height: 1;
}
.lobby-label {
  font-size: 13px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.waiting-dots span {
  display: inline-block;
  animation: dot 1.4s infinite;
  color: var(--gold);
  font-size: 24px;
}
.waiting-dots span:nth-child(2) { animation-delay: 0.2s; }
.waiting-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot { 0%,80%,100%{opacity:0} 40%{opacity:1} }

/* CATEGORY SELECT */
#catselect {
  padding: 1.5rem 1rem 1rem;
  overflow-y: auto;
}
.screen-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  color: var(--gold);
  letter-spacing: 0.08em;
  margin-bottom: 0.25rem;
}
.screen-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 1.25rem;
}
.cat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.cat-card {
  background: var(--gray);
  border: 1.5px solid var(--gray2);
  border-radius: 6px;
  padding: 16px 12px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  display: flex;
  flex-direction: column;
  gap: 4px;
  user-select: none;
}
.cat-card.selected {
  border-color: var(--gold);
  background: #1a1600;
}
.cat-icon { font-size: 28px; }
.cat-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--white);
}
.cat-count {
  font-size: 11px;
  color: var(--text-muted);
}
.start-bar {
  position: sticky;
  bottom: 0;
  background: var(--black);
  padding: 1rem;
  border-top: 1px solid var(--gray2);
}
.start-bar button {
  width: 100%;
  background: var(--gold);
  color: var(--black);
  border: none;
  border-radius: 4px;
  padding: 18px;
  font-size: 17px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: opacity 0.15s;
}
.start-bar button:disabled { opacity: 0.3; cursor: not-allowed; }

/* WAITING FOR HOST */
#waiting {
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  gap: 1.5rem;
}

/* PLAYER SCREEN */
#playerscreen {
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1rem;
  background: var(--gray);
  flex-shrink: 0;
}
.game-cat {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  color: var(--gold);
  letter-spacing: 0.08em;
}
.game-score {
  font-size: 13px;
  color: var(--text-muted);
}

/* TIMER */
.timer-ring-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
}
.timer-ring-wrap svg { transform: rotate(-90deg); }
.timer-track { fill: none; stroke: var(--gray2); stroke-width: 6; }
.timer-fill { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.5s; }
.timer-num {
  position: absolute;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  color: var(--white);
  letter-spacing: 0.05em;
}

.img-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  overflow: hidden;
  position: relative;
}
.question-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
  display: block;
}
.img-placeholder {
  width: 100%;
  height: 200px;
  background: var(--gray);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}
.guess-label {
  text-align: center;
  padding: 0.5rem 1rem 1rem;
  font-size: 14px;
  color: var(--text-muted);
  flex-shrink: 0;
}

/* JUDGE SCREEN */
#judgescreen {
  flex-direction: column;
  overflow: hidden;
}
.answer-big {
  background: var(--gray);
  margin: 1rem;
  border-radius: 8px;
  padding: 1.5rem 1rem;
  text-align: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(36px, 10vw, 56px);
  color: var(--gold);
  letter-spacing: 0.05em;
  line-height: 1.1;
  flex-shrink: 0;
}
.judge-timer-row {
  display: flex;
  justify-content: center;
  padding: 0.5rem 0;
  flex-shrink: 0;
}
.judge-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 1rem;
  flex-shrink: 0;
}
.judge-btn {
  padding: 22px 10px;
  border-radius: 8px;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.judge-btn:active { transform: scale(0.96); }
.judge-btn .bjicon { font-size: 28px; }
.btn-correct { background: var(--green); color: #fff; }
.btn-wrong { background: var(--red); color: #fff; }
.judge-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.hint-img-small {
  flex: 1;
  overflow: hidden;
  padding: 0 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hint-img-small img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 6px;
  opacity: 0.5;
}

/* RESULT FLASH */
.result-flash {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 80px;
  letter-spacing: 0.05em;
  z-index: 100;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}
.result-flash.show { opacity: 1; }
.result-flash.correct { background: #2d8a4e99; color: #fff; }
.result-flash.wrong { background: #d63b2f99; color: #fff; }
.result-flash.timeout { background: #c8a84b99; color: var(--black); }

/* SCOREBOARD */
#scoreboard {
  padding: 1.5rem;
  overflow-y: auto;
  gap: 1rem;
  align-items: stretch;
}
.score-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  color: var(--gold);
  letter-spacing: 0.08em;
}
.score-row {
  background: var(--gray);
  border-radius: 6px;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.score-row .sname { font-weight: 600; font-size: 18px; }
.score-row .spts {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  color: var(--gold);
}
.score-row.winner { border: 2px solid var(--gold); }
.next-btn {
  background: var(--gold);
  color: var(--black);
  border: none;
  border-radius: 4px;
  padding: 18px;
  font-size: 17px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: transform 0.1s;
  margin-top: auto;
}
.next-btn:active { transform: scale(0.97); }

/* ERROR */
.error-msg {
  color: var(--red);
  font-size: 13px;
  text-align: center;
  min-height: 18px;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  background: var(--gray2);
  color: var(--white);
  padding: 10px 20px;
  border-radius: 999px;
  font-size: 14px;
  z-index: 200;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

.divider {
  height: 1px;
  background: var(--gray2);
  margin: 0.5rem 0;
  flex-shrink: 0;
}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div id="home" class="screen active">
    <div class="logo">THE<br>FLOOR</div>
    <div class="logo-sub">Kuvatunnistuspeli</div>
    <button class="home-btn btn-create" onclick="createGame()">Luo peli</button>
    <button class="home-btn btn-join" onclick="toggleJoin()">Liity peliin</button>
    <div class="join-input-wrap" id="joinWrap">
      <input class="code-input" id="joinCode" maxlength="4" placeholder="KOODI" oninput="this.value=this.value.toUpperCase()" />
      <button class="btn-go" onclick="joinGame()">Liity →</button>
      <div class="error-msg" id="joinError"></div>
    </div>
  </div>

  <!-- LOBBY (host waiting for player 2) -->
  <div id="lobby" class="screen">
    <div class="lobby-label">Pelin koodi</div>
    <div class="room-code" id="lobbyCode">----</div>
    <div class="lobby-label" style="margin-top:1rem">Odotetaan toista pelaajaa</div>
    <div class="waiting-dots"><span>●</span><span>●</span><span>●</span></div>
    <button class="home-btn btn-join" style="margin-top:2rem;max-width:220px" onclick="goHome()">Peruuta</button>
  </div>

  <!-- CATEGORY SELECT (host only) -->
  <div id="catselect" class="screen">
    <div class="screen-title">Valitse kategoriat</div>
    <div class="screen-sub">Valitse 1–4 kategoriaa pelille</div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="start-bar">
      <button id="startBtn" onclick="startGame()" disabled>Aloita peli</button>
    </div>
  </div>

  <!-- WAITING (player 2 waits for host to start) -->
  <div id="waiting" class="screen">
    <div class="lobby-label">Liitytty peliin</div>
    <div class="room-code" style="font-size:clamp(48px,15vw,72px)">✓</div>
    <div class="lobby-label">Isäntä valitsee kategoriat</div>
    <div class="waiting-dots"><span>●</span><span>●</span><span>●</span></div>
  </div>

  <!-- PLAYER SCREEN (player 2 – sees image) -->
  <div id="playerscreen" class="screen">
    <div class="game-header">
      <div class="game-cat" id="pCat">–</div>
      <div class="game-score" id="pScore">0 pistettä</div>
    </div>
    <div class="timer-ring-wrap" style="padding-top:0.75rem">
      <svg width="90" height="90" viewBox="0 0 90 90">
        <circle class="timer-track" cx="45" cy="45" r="38"/>
        <circle class="timer-fill" id="pTimerFill" cx="45" cy="45" r="38"/>
      </svg>
      <div class="timer-num" id="pTimerNum">60</div>
    </div>
    <div class="img-container">
      <img class="question-img" id="playerImg" src="" alt="Tunnista kuva" style="display:none"/>
      <div class="img-placeholder" id="playerImgPlaceholder">📷</div>
    </div>
    <div class="guess-label">Mikä tämä on? Sano ääneen!</div>
  </div>

  <!-- JUDGE SCREEN (player 1 / host – sees answer) -->
  <div id="judgescreen" class="screen">
    <div class="game-header">
      <div class="game-cat" id="jCat">–</div>
      <div class="game-score" id="jScore">0 – 0</div>
    </div>
    <div class="answer-big" id="jAnswer">–</div>
    <div class="hint-img-small" id="jImgWrap">
      <img id="judgeImg" src="" alt="" style="display:none"/>
    </div>
    <div class="judge-timer-row">
      <div style="position:relative;display:inline-flex;align-items:center;justify-content:center">
        <svg width="80" height="80" viewBox="0 0 80 80">
          <circle class="timer-track" cx="40" cy="40" r="33"/>
          <circle class="timer-fill" id="jTimerFill" cx="40" cy="40" r="33"/>
        </svg>
        <div class="timer-num" id="jTimerNum" style="font-size:36px">60</div>
      </div>
    </div>
    <div class="judge-actions">
      <button class="judge-btn btn-correct" id="btnCorrect" onclick="judgeResult('correct')">
        <span class="bjicon">✓</span> Oikein
      </button>
      <button class="judge-btn btn-wrong" id="btnWrong" onclick="judgeResult('wrong')">
        <span class="bjicon">✗</span> Väärin
      </button>
    </div>
  </div>

  <!-- SCOREBOARD / ROUND END -->
  <div id="scoreboard" class="screen">
    <div class="score-title" id="sbTitle">Kierros ohi!</div>
    <div id="sbRows"></div>
    <div style="font-size:13px;color:var(--text-muted);text-align:center;margin-top:0.5rem" id="sbSub"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Seuraava kuva →</button>
  </div>

  <div class="result-flash" id="resultFlash"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

// ─── STATE ─────────────────────────────────────────────────────────────────
let state = {
  role: null,       // 'host' | 'player'
  roomId: null,
  channel: null,
  selectedCats: [],
  questions: [],
  qIndex: 0,
  scores: {host:0, player:0},
  timerInt: null,
  timeLeft: 60,
  judgeDisabled: false,
};

// ─── UTILS ─────────────────────────────────────────────────────────────────
function randomCode() {
  return Math.random().toString(36).slice(2,6).toUpperCase();
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

const CIRC_P = 2 * Math.PI * 38;
const CIRC_J = 2 * Math.PI * 33;
function updateTimerUI(t) {
  const pct = t / 60;
  const pf = document.getElementById('pTimerFill');
  const jf = document.getElementById('jTimerFill');
  const color = t > 20 ? '#2d8a4e' : t > 10 ? '#c8a84b' : '#d63b2f';
  if(pf) {
    pf.style.strokeDasharray = CIRC_P;
    pf.style.strokeDashoffset = CIRC_P * (1 - pct);
    pf.style.stroke = color;
  }
  if(jf) {
    jf.style.strokeDasharray = CIRC_J;
    jf.style.strokeDashoffset = CIRC_J * (1 - pct);
    jf.style.stroke = color;
  }
  document.getElementById('pTimerNum').textContent = t;
  document.getElementById('jTimerNum').textContent = t;
}

// ─── SUPABASE CHANNEL ──────────────────────────────────────────────────────
function joinChannel(roomId) {
  if(state.channel) supabase.removeChannel(state.channel);
  const ch = supabase.channel('room:'+roomId, {config:{broadcast:{self:false}}});
  ch.on('broadcast', {event:'*'}, ({event,payload}) => handleMsg(event, payload));
  ch.subscribe();
  state.channel = ch;
}
function send(event, payload={}) {
  if(!state.channel) return;
  state.channel.send({type:'broadcast', event, payload});
}

// ─── HOME ──────────────────────────────────────────────────────────────────
function toggleJoin() {
  const w = document.getElementById('joinWrap');
  w.classList.toggle('visible');
  if(w.classList.contains('visible')) document.getElementById('joinCode').focus();
}
function goHome() {
  if(state.channel) supabase.removeChannel(state.channel);
  state = {role:null,roomId:null,channel:null,selectedCats:[],questions:[],qIndex:0,scores:{host:0,player:0},timerInt:null,timeLeft:60,judgeDisabled:false};
  showScreen('home');
}

// ─── CREATE GAME ───────────────────────────────────────────────────────────
function createGame() {
  const code = randomCode();
  state.role = 'host';
  state.roomId = code;
  joinChannel(code);
  document.getElementById('lobbyCode').textContent = code;
  showScreen('lobby');
}

// ─── JOIN GAME ─────────────────────────────────────────────────────────────
async function joinGame() {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  document.getElementById('joinError').textContent = '';
  if(code.length !== 4) { document.getElementById('joinError').textContent = 'Anna 4-kirjaiminen koodi'; return; }
  state.role = 'player';
  state.roomId = code;
  joinChannel(code);
  showScreen('waiting');
  send('player_joined');
}

// ─── HANDLE MESSAGES ───────────────────────────────────────────────────────
function handleMsg(event, payload) {
  if(event === 'player_joined' && state.role === 'host') {
    // Build category selection
    buildCatGrid();
    showScreen('catselect');
  }
  if(event === 'game_start' && state.role === 'player') {
    state.questions = payload.questions;
    state.scores = {host:0,player:0};
    state.qIndex = 0;
    showQuestion();
  }
  if(event === 'timer_tick' && state.role === 'player') {
    updateTimerUI(payload.t);
  }
  if(event === 'judge_result') {
    handleJudgeResult(payload);
  }
  if(event === 'next_question' && state.role === 'player') {
    state.qIndex = payload.qIndex;
    state.scores = payload.scores;
    showQuestion();
  }
}

// ─── CATEGORY SELECT ───────────────────────────────────────────────────────
function buildCatGrid() {
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const div = document.createElement('div');
    div.className = 'cat-card';
    div.dataset.id = cat.id;
    div.innerHTML = `<span class="cat-icon">${cat.icon}</span><span class="cat-name">${cat.name}</span><span class="cat-count">${cat.questions.length} kuvaa</span>`;
    div.onclick = () => toggleCat(cat.id, div);
    grid.appendChild(div);
  });
}
function toggleCat(id, el) {
  if(state.selectedCats.includes(id)) {
    state.selectedCats = state.selectedCats.filter(c=>c!==id);
    el.classList.remove('selected');
  } else if(state.selectedCats.length < 4) {
    state.selectedCats.push(id);
    el.classList.add('selected');
  }
  document.getElementById('startBtn').disabled = state.selectedCats.length === 0;
}

// ─── START GAME ────────────────────────────────────────────────────────────
function startGame() {
  // Build shuffled question list from selected categories
  let qs = [];
  state.selectedCats.forEach(cid => {
    const cat = CATEGORIES.find(c=>c.id===cid);
    if(cat) cat.questions.forEach(q => qs.push({...q, cat:cat.name, catIcon:cat.icon}));
  });
  // shuffle
  for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}
  state.questions = qs;
  state.qIndex = 0;
  state.scores = {host:0, player:0};
  send('game_start', {questions: qs});
  showQuestion();
}

// ─── SHOW QUESTION ─────────────────────────────────────────────────────────
function showQuestion() {
  clearInterval(state.timerInt);
  state.judgeDisabled = false;
  if(state.qIndex >= state.questions.length) {
    showFinalScore();
    return;
  }
  const q = state.questions[state.qIndex];

  if(state.role === 'host') {
    // Judge screen
    document.getElementById('jCat').textContent = (q.catIcon||'') + ' ' + q.cat;
    document.getElementById('jScore').textContent = `Host ${state.scores.host} – ${state.scores.player} Pelaaja`;
    document.getElementById('jAnswer').textContent = q.answer;
    const ji = document.getElementById('judgeImg');
    ji.src = q.img; ji.style.display='block';
    document.getElementById('btnCorrect').disabled = false;
    document.getElementById('btnWrong').disabled = false;
    showScreen('judgescreen');
  } else {
    // Player screen
    document.getElementById('pCat').textContent = (q.catIcon||'') + ' ' + q.cat;
    document.getElementById('pScore').textContent = `Pisteet: ${state.scores.player}`;
    const pi = document.getElementById('playerImg');
    const pp = document.getElementById('playerImgPlaceholder');
    pi.style.display='none'; pp.style.display='flex';
    pi.onload = ()=>{ pi.style.display='block'; pp.style.display='none'; };
    pi.src = q.img;
    showScreen('playerscreen');
  }

  // Start timer
  state.timeLeft = 60;
  updateTimerUI(60);
  state.timerInt = setInterval(() => {
    state.timeLeft--;
    updateTimerUI(state.timeLeft);
    if(state.role === 'host') send('timer_tick', {t: state.timeLeft});
    if(state.timeLeft <= 0) {
      clearInterval(state.timerInt);
      if(state.role === 'host') judgeResult('timeout');
    }
  }, 1000);
}

// ─── JUDGE RESULT ──────────────────────────────────────────────────────────
function judgeResult(outcome) {
  if(state.judgeDisabled) return;
  state.judgeDisabled = true;
  clearInterval(state.timerInt);
  document.getElementById('btnCorrect').disabled = true;
  document.getElementById('btnWrong').disabled = true;

  if(outcome === 'correct') state.scores.player++;

  send('judge_result', {outcome, scores: state.scores, qIndex: state.qIndex});
  handleJudgeResult({outcome, scores: state.scores, qIndex: state.qIndex});
}

function handleJudgeResult({outcome, scores, qIndex}) {
  clearInterval(state.timerInt);
  state.scores = scores;

  const flash = document.getElementById('resultFlash');
  if(outcome==='correct') { flash.textContent='✓ OIKEIN!'; flash.className='result-flash correct show'; }
  else if(outcome==='wrong') { flash.textContent='✗ VÄÄRIN'; flash.className='result-flash wrong show'; }
  else { flash.textContent='⏱ AIKA!'; flash.className='result-flash timeout show'; }
  setTimeout(()=>{ flash.className='result-flash'; showRoundEnd(outcome, qIndex); }, 1200);
}

function showRoundEnd(outcome, qIndex) {
  const q = state.questions[qIndex];
  document.getElementById('sbTitle').textContent =
    outcome==='correct' ? '✓ Oikein!' : outcome==='wrong' ? '✗ Väärin' : '⏱ Aika loppui';
  const rows = document.getElementById('sbRows');
  rows.innerHTML = `
    <div class="score-row" style="margin-bottom:10px">
      <span class="sname">Oikea vastaus</span>
      <span style="font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold)">${q.answer}</span>
    </div>
    <div class="score-row">
      <span class="sname">Pelaaja</span><span class="spts">${state.scores.player}</span>
    </div>
    <div class="score-row" style="margin-top:8px">
      <span class="sname">Host</span><span class="spts">${state.scores.host}</span>
    </div>`;
  const isLast = qIndex >= state.questions.length - 1;
  const nextBtn = document.getElementById('nextBtn');
  if(state.role === 'host') {
    nextBtn.style.display = 'block';
    nextBtn.textContent = isLast ? 'Lopputulokset →' : 'Seuraava kuva →';
  } else {
    nextBtn.style.display = 'none';
  }
  document.getElementById('sbSub').textContent = `Kuva ${qIndex+1} / ${state.questions.length}`;
  showScreen('scoreboard');
}

function nextQuestion() {
  state.qIndex++;
  send('next_question', {qIndex: state.qIndex, scores: state.scores});
  showQuestion();
}

function showFinalScore() {
  const playerWins = state.scores.player > state.scores.host;
  const tie = state.scores.player === state.scores.host;
  document.getElementById('sbTitle').textContent = tie ? 'Tasapeli!' : playerWins ? 'Pelaaja voitti!' : 'Host voitti!';
  document.getElementById('sbRows').innerHTML = `
    <div class="score-row ${playerWins||tie?'winner':''}">
      <span class="sname">Pelaaja</span><span class="spts">${state.scores.player}</span>
    </div>
    <div class="score-row ${!playerWins&&!tie?'winner':''}">
      <span class="sname">Host</span><span class="spts">${state.scores.host}</span>
    </div>`;
  document.getElementById('sbSub').textContent = 'Peli ohi!';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = 'Pelaa uudelleen';
  nextBtn.onclick = goHome;
  nextBtn.style.display = 'block';
  showScreen('scoreboard');
}
</script>
